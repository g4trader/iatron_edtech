name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  E2E_BROWSER_CHANNEL: chrome

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Authenticate public image pulls with the ephemeral job token
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:start
      - run: pnpm db:test
      - run: pnpm build
      - name: Verify preinstalled Chrome
        run: google-chrome --version
      - name: Acquisition funnel with isolated local Supabase
        run: pnpm test:e2e:auth acquisition-flow.spec.ts
      - run: pnpm test:e2e:mock
      - name: Acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-evidence
          path: apps/web/test-results/**/*.png
          retention-days: 7
