name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:start
      - run: pnpm db:test
      - run: pnpm build
      - run: pnpm --filter @iatron/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:mock

  acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo build --filter=@iatron/api...
      - name: Start isolated Supabase (retry transient registry limits once)
        run: pnpm db:start || { sleep 10; pnpm db:start; }
      - run: pnpm --filter @iatron/web exec playwright install --with-deps chromium
      - name: Acquisition funnel with isolated local Supabase
        run: pnpm test:e2e:auth acquisition-flow.spec.ts
      - name: Acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-evidence
          path: apps/web/test-results/**/*.png
          retention-days: 7
