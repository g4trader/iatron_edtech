name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  E2E_BROWSER_CHANNEL: chrome

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Authenticate public image pulls with the ephemeral job token
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start Supabase with bounded registry retries
        shell: bash
        run: |
          startup_log="$RUNNER_TEMP/supabase-start.log"
          for attempt in 1 2 3; do
            if pnpm db:start >"$startup_log" 2>&1; then
              echo "Supabase ready; database and E2E checks remain required."
              exit 0
            fi
            if ! grep -Eqi 'toomanyrequests|rate limit|Data limit exceeded|failed to pull docker image' "$startup_log"; then
              echo "Supabase initialization failed outside registry downloads."
              grep -Ei 'error|failed|unhealthy' "$startup_log" | tail -15 || true
              exit 1
            fi
            echo "Image registry unavailable (attempt $attempt/3); retaining downloaded layers."
            if [ "$attempt" -eq 3 ]; then
              grep -Ei 'toomanyrequests|failed to pull docker image' "$startup_log" | tail -15 || true
              exit 1
            fi
            sleep 20
          done
      - run: pnpm db:test
      - run: pnpm build
      - name: Verify preinstalled Chrome
        run: google-chrome --version
      - name: Acquisition funnel with isolated local Supabase
        run: pnpm test:e2e:auth acquisition-flow.spec.ts preparation-flow.spec.ts
      - name: Acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-evidence
          path: apps/web/test-results/**/*.png
          retention-days: 7
      - run: pnpm test:e2e:mock
